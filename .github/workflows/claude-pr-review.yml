name: Claude PR Code Review

on:
  pull_request:
    types: [labeled]

jobs:
  code-review:
    # Only run when the 'claude-review' label is added
    if: github.event.label.name == 'claude-review'
    permissions:
      contents: read
      pull-requests: write
    uses: miwdesign/mcb-github-workflows/.github/workflows/claude-pr-review.yml@v1
    secrets: inherit
